resources:
  jobs:
    movies_daily_dq_workflow:
      name: "[${bundle.target}] Movies End-to-End Analytics & DQ Workflow"
      tasks:
        # Task 1: Trigger Silver & Quarantine DLT pipeline
        - task_key: run_silver_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.movies_dlt_pipeline.id}

        # Task 2: Build Gold dimensional model
        - task_key: build_gold_layer
          depends_on:
            - task_key: run_silver_pipeline
          notebook_task:
            notebook_path: ../src/movies_gold_layer
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Task 3: Enforce storage-level constraints
        - task_key: apply_delta_constraints
          depends_on:
            - task_key: build_gold_layer
          notebook_task:
            notebook_path: ../src/02_delta_constraints
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Task 4: Zero silent data loss reconciliation audit
        - task_key: reconciliation_check
          depends_on:
            - task_key: apply_delta_constraints
          notebook_task:
            notebook_path: ../src/03_reconciliation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Task 5: Final Gold uniqueness and null checks
        - task_key: gold_dq_checks
          depends_on:
            - task_key: reconciliation_check
          notebook_task:
            notebook_path: ../src/04_gold_dq_checks
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}