name: CI/CD Lab 8 Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Test & Validate Bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Run Pytest Unit Tests
        working-directory: Lab 8
        env:
          PYTHONPATH: ${{ github.workspace }}/Lab 8/src
        run: pytest tests/test_transforms.py -v

      - name: Validate Databricks Asset Bundle
        working-directory: Lab 8
        run: databricks bundle validate -t dev

  deploy:
    name: Deploy to PROD
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to PROD
        working-directory: Lab 8
        run: databricks bundle deploy -t prod --auto-approve

      - name: Trigger PROD Workflow Run
        working-directory: Lab 8
        run: databricks bundle run -t prod movies_daily_dq_workflow
